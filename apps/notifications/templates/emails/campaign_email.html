<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>{{ campaign.name }}</title>
</head>

<body style="margin:0;padding:40px;background:#f5f5f5;font-family:Arial,sans-serif;">

<table width="600" align="center" cellpadding="0" cellspacing="0"
       style="background:#ffffff;padding:40px;border-radius:10px;">

<tr>
<td>

<h1 style="color:#2563eb;margin-bottom:10px;">
    {{ company_name }}
</h1>

<hr>

<h2>Hello {{ recipient.name }},</h2>

<p>
    We hope you're doing well.
</p>

<h3 style="color:#111827;">
    {{ campaign.name }}
</h3>

<p>
    {{ campaign.description }}
</p>

<br>

<a href="http://host.docker.internal:8000/api/click/{{ recipient.id }}/"
style="
background:#2563eb;
color:white;
padding:14px 24px;
text-decoration:none;
border-radius:6px;
display:inline-block;
font-weight:bold;
">
Visit Website
</a>

<br><br>

<p>
    Thank you for choosing us.
</p>

<br>

<a
    href="http://host.docker.internal:8000/api/track/click/{{ recipient.id }}/?url=https://www.djangoproject.com/"
    style="
        background:#2563eb;
        color:white;
        padding:12px 24px;
        text-decoration:none;
        border-radius:6px;
        display:inline-block;
    "
>
    Visit Our Website
</a>

<br>

<strong>
Regards,
</strong>

<br>

{{ company_name }}

</td>
</tr>

</table>

<!-- Open Tracking Pixel -->
<img
src="http://host.docker.internal:8000/api/track/open/{{ recipient.id }}/"
width="1"
height="1"
style="display:none;"
alt=""
>

</body>
</html>
